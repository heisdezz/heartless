name: Debug Release
on: workflow_dispatch

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.semver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: semver
        run: bash scripts/semver.sh

  debug:
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fake artifacts
        run: |
          mkdir -p dist
          echo hello > dist/file.txt
      - name: gh release create with assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_DEBUG: api
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          echo "TAG=$TAG"
          gh release create "$TAG" dist/* --title "Debug $TAG" --target "$GITHUB_SHA" --generate-notes 2>&1 | head -60
