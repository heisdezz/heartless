name: Debug Release
on: workflow_dispatch

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: gh release create
        env:
          GH_TOKEN: ${{ github.token }}
          GH_DEBUG: api
        run: |
          gh --version
          gh release create v0.0.0-debug2 --title debug --target main --generate-notes 2>&1 | head -80
