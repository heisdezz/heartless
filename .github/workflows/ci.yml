name: CI and Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Build output, matching "out" in mygo.json.
  BUILD_DIR: build

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      bump: ${{ steps.semver.outputs.bump }}
      should_release: ${{ steps.semver.outputs.should_release }}
    steps:
      # Full history and tags are needed to find the last release and scan the
      # conventional commits since it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: semver
        run: bash scripts/semver.sh

  test:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^$' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -timeout 5m

  build:
    name: Build ${{ matrix.name }}
    needs: [test, version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds both architectures into one universal app and makes the
          # .dmg, which needs macOS.
          - name: macos
            os: macos-latest
            platform: darwin/universal
            artifact: heartless-macos
          - name: linux
            os: ubuntu-latest
            platform: linux/amd64
            artifact: heartless-linux
          - name: windows
            os: windows-latest
            platform: windows/amd64
            artifact: heartless-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Stamp version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tmp="$(mktemp)"
          sed -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]*(\")/\1${VERSION}\2/" mygo.json > "$tmp"
          mv "$tmp" mygo.json
          echo "Building version $VERSION"

      # The Linux build links GTK/WebKit, which the runner needs present.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libgl1-mesa-dev

      - name: Build app
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          args=(-platform "$PLATFORM" -o "$BUILD_DIR")
          # Ad-hoc sign on macOS so the bundle runs without a Developer ID.
          if [ "$RUNNER_OS" = "macOS" ]; then
            args+=(-sign -)
          fi
          go tool mygo build "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.BUILD_DIR }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs: [build, version]
    # Only publish on main, and only when the commits since the last tag
    # actually call for a version bump.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files to publish
        run: find dist -type f | sort

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          BUMP: ${{ needs.version.outputs.bump }}
        run: |
          # Publish the installers for each platform, not every file inside an
          # app bundle. Stage them flat so each asset has a simple, unique name.
          mkdir -p stage
          for pattern in \
            "dist/darwin-universal/*.dmg" \
            "dist/linux-amd64/*.deb" \
            "dist/linux-amd64/*.rpm" \
            "dist/linux-amd64/*.tar.gz" \
            "dist/linux-amd64/install.sh" \
            "dist/windows-amd64/*.exe"; do
            cp $pattern stage/ 2>/dev/null || true
          done

          assets=()
          for file in stage/*; do
            [ -f "$file" ] && assets+=("$file")
          done
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no release assets found" >&2
            exit 1
          fi
          printf 'Assets:\n'
          printf '  %s\n' "${assets[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running for the same version replaces its assets.
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "Heartless $VERSION" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi
          echo "Published $TAG ($BUMP release)"
